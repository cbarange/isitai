# Unsigned metadata rules.

# IPTC Digital Source Type values (https://cv.iptc.org/newscodes/digitalsourcetype/).
[digital_source_type]
ai = ["trainedAlgorithmicMedia", "compositeWithTrainedAlgorithmicMedia"]
capture = ["digitalCapture", "computationalCapture"]

# PNG tEXt/iTXt keywords written by local image generators. A keyword alone is not
# evidence: the chunk value must contain `marker`. Compressed values (zTXt,
# compressed iTXt) are not read.
[[png_key]]
key = "parameters"
marker = "Steps:"
generator = "Stable Diffusion WebUI (A1111/Forge)"

[[png_key]]
key = "prompt"
marker = "class_type"
generator = "ComfyUI"

[[png_key]]
key = "workflow"
marker = "nodes"
generator = "ComfyUI"

[[png_key]]
key = "invokeai_metadata"
marker = "{"
generator = "InvokeAI"

# PNG `Software` value equal to this text, once trimmed.
[[png_software]]
equals = "NovelAI"
generator = "NovelAI"
