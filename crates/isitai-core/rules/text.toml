# Text artifact rules. Patterns use Rust `regex` syntax.
# strength: "strong" (one is enough for ai-signal) or "weak" (two distinct needed).
# Patterns marked `verified = false` come from memory and must be confirmed on the corpus.

[[rule]]
id = "text.oaicite"
strength = "strong"
verified = false
detail = "ChatGPT citation placeholder left by copy-paste"
pattern = ':contentReference\[oaicite:\d+\]\{index=\d+\}|【oaicite:\d+】'

[[rule]]
id = "text.citeturn"
strength = "strong"
verified = false
detail = "ChatGPT search citation token left by copy-paste"
# `cite` is glued to the token in pasted text ("citeturn0search3").
pattern = '(?:\b|cite)turn\d+(?:search|news|view|fetch|file|image)\d+\b'

[[rule]]
id = "text.utm-ai"
# Weak: the tag describes a link, not the text around it.
strength = "weak"
verified = false
detail = "Link tagged by an AI assistant"
pattern = 'utm_source=(?:chatgpt\.com|openai)\b'

[[rule]]
id = "text.self-disclosure"
strength = "strong"
verified = false
# The assistant's own voice is required: the phrase must be followed by the pronoun
# "I" (case-sensitive) or ", je". Human sentences that must not match:
# "As an AI model grows, ...", "as an AI language model gets deployed ...",
# "As an AI researcher, I think ...", "En tant qu'intelligence artificielle
# générative, ChatGPT ...".
detail = "Assistant self-disclosure phrase"
pattern = '(?i:\bas an AI(?: language)?(?: model| assistant)?),? I\b|(?i:\bas of my (?:last )?knowledge (?:update|cutoff)\b)|(?i:\ben tant qu(?:e |\x27|’)(?:modèle de langage|IA|intelligence artificielle), je\b)'

[[rule]]
id = "text.zero-width"
strength = "weak"
verified = false
# U+200D (ZWJ) is excluded on purpose: emoji sequences use it.
# U+202F / U+00A0 are normal French typography and are never rules.
detail = "Zero-width character inside the text"
pattern = '[\x{200B}\x{2060}]|.\x{FEFF}'
