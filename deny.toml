# Politique de dépendances : licences acceptables, avis de sécurité, sources de confiance.
# Une bibliothèque MIT ne peut pas embarquer une dépendance copyleft sans piéger ses
# utilisateurs : c'est un défaut de licence, pas un détail.

[advisories]
# Une version retirée du registre peut disparaître du build : on refuse.
yanked = "deny"

[licenses]
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "MPL-2.0",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "Zlib",
  "CC0-1.0",
  "Unlicense",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
# Les crates du workspace se référencent par chemin : ce n'est pas un joker de version,
# cargo le résout en version exacte à la publication. Un vrai joker hors workspace reste
# signalé par la revue, pas par cette règle.
wildcards = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
