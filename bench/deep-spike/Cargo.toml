# Standalone spike: NOT a member of the isitai workspace (own [workspace] table).
[package]
name = "isitai-deep-spike"
version = "0.0.0"
edition = "2021"
publish = false

[workspace]

[features]
default = []
# ONNX Runtime, library downloaded by ort-sys at BUILD time (pyke prebuilt, static link)
ort-download = ["dep:ort", "ort/download-binaries", "ort/tls-rustls", "native-tok"]
# ONNX Runtime loaded at run time from ORT_DYLIB_PATH (no download at build time)
ort-dynamic = ["dep:ort", "ort/load-dynamic", "native-tok"]
rten-rt = ["dep:rten", "dep:rten-tensor"]
tract-rt = ["dep:tract-onnx", "native-tok"]
native-tok = ["tokenizers/onig"]
wasm-tok = ["tokenizers/unstable_wasm"]

[dependencies]
tokenizers = { version = "0.23", default-features = false }
serde_json = "1"
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "ndarray"], optional = true }
rten = { version = "0.28", optional = true }
rten-tensor = { version = "0.28", optional = true }
tract-onnx = { version = "0.23", optional = true }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
