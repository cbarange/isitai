[package]
name = "isitai"
version = "0.0.1"
edition = "2021"
license = "MIT"
description = "Local, offline check for proof or signals that a text, image, audio, video or PDF was made by AI (C2PA, IPTC, generator metadata). Work in progress."
readme = "README.md"
keywords = ["ai-detection", "c2pa", "provenance", "iptc", "deepfake"]
categories = ["multimedia", "text-processing"]

