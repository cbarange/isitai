[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "isitai"
version = "0.0.1"
description = "Local, offline check for proof or signals that a text, image, audio, video or PDF was made by AI (C2PA, IPTC, generator metadata). Work in progress."
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [{ name = "cbarange" }]
keywords = ["ai-detection", "c2pa", "content-credentials", "iptc", "provenance", "deepfake"]
classifiers = ["Development Status :: 1 - Planning"]

[tool.hatch.build.targets.wheel]
packages = ["isitai"]
