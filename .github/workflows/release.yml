# Builds every artifact on a version tag (vX.Y.Z or vX.Y.Z-alpha.N), then publishes
# to npm, PyPI and crates.io.
#
# Security (public repo):
# - No long-lived token by default. Publishing uses OIDC trusted publishing: each
#   registry trusts this exact repo + workflow file + `release` environment.
# - Only the three publish jobs get `id-token: write`, and they run in the
#   `release` environment, which requires a manual approval and only accepts
#   `v*` tags (see docs/RELEASING.md).
# - Build jobs have read-only access and never see secrets.
# - Actions are pinned by commit SHA.
name: Release

on:
  push:
    tags: ["v*"]

permissions: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  versions:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      npm-tag: ${{ steps.tag.outputs.npm }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 scripts/check_versions.py "$GITHUB_REF_NAME"
      - run: python3 scripts/check_changelog.py "$GITHUB_REF_NAME"
      - id: tag
        # Pre-releases go to the `next` dist-tag so `npm i isitai` never installs them.
        run: |
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then echo "npm=next" >> "$GITHUB_OUTPUT"; else echo "npm=latest" >> "$GITHUB_OUTPUT"; fi

  node-build:
    name: Node ${{ matrix.target }}
    needs: versions
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: aarch64-apple-darwin, os: macos-15 }
          - { target: x86_64-apple-darwin, os: macos-15 }
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-22.04 }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-22.04-arm }
          - { target: x86_64-unknown-linux-musl, os: ubuntu-24.04, zig: true }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04, zig: true }
          - { target: x86_64-pc-windows-msvc, os: windows-2025 }
          - { target: aarch64-pc-windows-msvc, os: windows-11-arm }
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - if: matrix.zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
      - if: matrix.zig
        run: cargo install cargo-zigbuild --locked
      - name: Build
        working-directory: bindings/node
        shell: bash
        run: |
          npm ci --ignore-scripts
          npx napi build --platform --release --target ${{ matrix.target }} --js native.js --dts native.d.ts ${{ matrix.zig && '-x' || '' }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: node-${{ matrix.target }}
          path: bindings/node/*.node
          if-no-files-found: error
      - if: matrix.target == 'x86_64-unknown-linux-gnu'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: node-loader
          path: |
            bindings/node/native.js
            bindings/node/native.d.ts
          if-no-files-found: error

  python-wheels:
    name: Wheel ${{ matrix.target }} ${{ matrix.manylinux }}
    needs: versions
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, target: x86_64, manylinux: auto }
          - { os: ubuntu-24.04-arm, target: aarch64, manylinux: auto }
          - { os: ubuntu-24.04, target: x86_64, manylinux: musllinux_1_2 }
          - { os: ubuntu-24.04-arm, target: aarch64, manylinux: musllinux_1_2 }
          - { os: macos-15, target: aarch64 }
          - { os: macos-15, target: x86_64 }
          - { os: windows-2025, target: x64 }
          - { os: windows-11-arm, target: aarch64 }
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          working-directory: bindings/python
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux || 'off' }}
          args: --release --out dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheel-${{ matrix.os }}-${{ matrix.target }}-${{ matrix.manylinux || 'native' }}
          path: bindings/python/dist/*.whl
          if-no-files-found: error

  python-sdist:
    needs: versions
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          working-directory: bindings/python
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sdist
          path: bindings/python/dist/*.tar.gz
          if-no-files-found: error

  size-gate:
    name: Budget de taille avant publication
    needs: [node-build, python-wheels, python-sdist]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      # Baseline mesurée le 2026-11-12 : 4 967 Ko (c2pa + crypto natif, strip et LTO actifs).
      # Marge de 5 %. Un wheel au-delà signale une dépendance ajoutée, pas un arrondi.
      WHEEL_MAX_KB: "5200"
      SDIST_MAX_KB: "900"
      NODE_MAX_KB: "4096"
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
          merge-multiple: true
      - name: Refuser un paquet hors budget
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, pathlib, sys
          limits = {".whl": int(os.environ["WHEEL_MAX_KB"]),
                    ".tar.gz": int(os.environ["SDIST_MAX_KB"]),
                    ".node": int(os.environ["NODE_MAX_KB"])}
          rows, over = [], []
          for f in sorted(pathlib.Path("artifacts").rglob("*")):
              if not f.is_file():
                  continue
              for suffix, limit in limits.items():
                  if f.name.endswith(suffix):
                      size = f.stat().st_size // 1024
                      rows.append((f.name, size, limit))
                      if size > limit:
                          over.append(f"{f.name} : {size} Ko > {limit} Ko")
          for name, size, limit in rows:
              print(f"  {name:<52} {size:>5} Ko / {limit} Ko")
          if not rows:
              sys.exit("aucun artefact à contrôler : le build est cassé en amont")
          if over:
              sys.exit("budget dépassé —\n  " + "\n  ".join(over))
          PY

  publish-npm:
    needs: [versions, node-build, size-gate]
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: read
      id-token: write # npm trusted publishing + provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm install -g "npm@^11.5.1" # trusted publishing needs npm >= 11.5.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: node-*
          path: bindings/node/artifacts
          merge-multiple: true
      - name: Prepare packages
        working-directory: bindings/node
        run: |
          mv artifacts/native.js artifacts/native.d.ts .
          npm ci --ignore-scripts
          npx napi create-npm-dirs
          npx napi artifacts --output-dir artifacts
          node ../../scripts/npm_prepare.js
          cp ../../README.md README.md
      - name: Publish
        working-directory: bindings/node
        env:
          # Optional bootstrap only: the scoped platform packages must exist before a
          # trusted publisher can be attached to them. Leave this secret unset otherwise.
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TAG: ${{ needs.versions.outputs.npm-tag }}
        run: |
          if [ -n "$NPM_TOKEN" ]; then
            echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > "$RUNNER_TEMP/.npmrc"
            export NPM_CONFIG_USERCONFIG="$RUNNER_TEMP/.npmrc"
          fi
          for dir in npm/*/; do
            (cd "$dir" && npm publish --provenance --access public --tag "$NPM_TAG")
          done
          npm publish --provenance --access public --tag "$NPM_TAG"

  publish-pypi:
    needs: [versions, python-wheels, python-sdist, size-gate]
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      id-token: write # PyPI trusted publishing
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sdist
          path: dist
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          # Vide = publication de confiance par OIDC. Renseigné = jeton, utile pour le
          # premier envoi d'un projet que PyPI ne connaît pas encore.
          password: ${{ secrets.PIPY }}

  publish-crates:
    needs: versions
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: read
      id-token: write # crates.io trusted publishing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - name: Jeton crates.io déclaré ?
        id: token
        env:
          CRATES_IO: ${{ secrets.CRATES_IO }}
        run: |
          if [ -n "${CRATES_IO:-}" ]; then
            echo "::add-mask::$CRATES_IO"
            echo "token=$CRATES_IO" >> "$GITHUB_OUTPUT"
          fi
      - uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
        id: auth
        if: steps.token.outputs.token == ''
      - name: Un numéro de version publié ne se réutilise pas
        run: |
          version=$(python3 -c "import tomllib;print(tomllib.load(open('Cargo.toml','rb'))['workspace']['package']['version'])")
          if curl -fsS "https://crates.io/api/v1/crates/isitai/$version" > /dev/null 2>&1; then
            echo "isitai $version existe déjà sur crates.io : publication impossible, incrémenter la version" >&2
            exit 1
          fi
      - run: cargo publish -p isitai
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.token.outputs.token || steps.auth.outputs.token }}
