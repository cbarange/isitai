# Tests on every push to main and every pull request.
# Security (public repo): no secret is used here, the token is read-only, and
# `pull_request` (never `pull_request_target`) runs fork code without secrets.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --exclude isitai-node --exclude isitai-python -- -D warnings
      - run: cargo test --workspace --exclude isitai-node --exclude isitai-python
      - run: python3 scripts/check_versions.py

  bindings:
    name: Bindings (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Node binding
        working-directory: bindings/node
        shell: bash
        run: |
          npm ci --ignore-scripts
          npm run build
          npm test
      - name: Python binding
        working-directory: bindings/python
        shell: bash
        run: |
          python -m venv .venv
          if [ -f .venv/Scripts/python.exe ]; then PY=.venv/Scripts/python.exe; else PY=.venv/bin/python; fi
          "$PY" -m pip install --quiet maturin==1.16.0
          "$PY" -m maturin build --release --out dist
          "$PY" -m pip install --quiet --pre --no-index --find-links dist isitai
          "$PY" -m unittest discover -s tests -v

  cross-language:
    name: CLI = Node = Python
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Build the three front ends
        run: |
          cargo build --release -p isitai-cli
          (cd bindings/node && npm ci --ignore-scripts && npm run build)
          python -m venv .venv
          .venv/bin/pip install --quiet maturin==1.16.0 c2pa-python==0.38.0  # 0.38.1 and 0.38.2 shipped no Linux wheels
          (cd bindings/python && ../../.venv/bin/maturin build --release --out dist)
          .venv/bin/pip install --quiet --pre --no-index --find-links bindings/python/dist isitai
      - name: Fetch c2pa-rs fixtures and build the signed corpus
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bench/fetch_fixtures.sh "$RUNNER_TEMP/c2pa"
          .venv/bin/python -I bench/corpus/make_signed.py "$RUNNER_TEMP/c2pa/fixtures" "$RUNNER_TEMP/c2pa/certs" "$RUNNER_TEMP/signed"
      - name: Diff the reports
        run: |
          python3 -I bench/crosslang/diff.py target/release/isitai bindings/node .venv/bin/python \
            "$RUNNER_TEMP/c2pa/fixtures/test_cert_root_bundle.pem" "$RUNNER_TEMP/c2pa/fixtures" "$RUNNER_TEMP/signed"

  hygiene:
    name: Hygiène (workflows, licences, secrets)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # l'analyse de secrets a besoin de l'historique complet
      - name: Lint des workflows
        uses: reviewdog/action-actionlint@v1
        with:
          fail_level: error
      - name: Licences, doublons et sources des dépendances
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses bans sources
      - name: Aucun secret dans l'arbre ni dans l'historique
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_SUMMARY: "true"

  package-size:
    name: Taille des paquets
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      # Budgets provisoires, à recalibrer sur la première mesure réelle : ils sont là pour
      # attraper une régression d'un facteur 2, pas pour arbitrer quelques kilo-octets.
      CRATE_MAX_KB: "700"
      NPM_MAX_KB: "500"
      SDIST_MAX_KB: "900"
      WHEEL_MAX_KB: "4096"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Construire les paquets minimaux
        run: |
          set -euo pipefail
          cargo package -p isitai --no-verify --allow-dirty
          (cd bindings/node && npm pack --dry-run --json --ignore-scripts > pack.json)
          python -m pip install --quiet maturin==1.16.0
          (cd bindings/python && maturin sdist --out dist)
          maturin build --release --out "$RUNNER_TEMP/dist" --manifest-path bindings/python/Cargo.toml
      - name: Comparer aux budgets
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, pathlib, sys

          def kb(p):
              return pathlib.Path(p).stat().st_size // 1024

          rows, over = [], []
          crate = next(pathlib.Path("target/package").glob("isitai-*.crate"))
          rows.append(("crate", kb(crate), int(os.environ["CRATE_MAX_KB"])))
          pack = json.loads(pathlib.Path("bindings/node/pack.json").read_text())
          rows.append(("npm (méta)", pack[0]["size"] // 1024, int(os.environ["NPM_MAX_KB"])))
          sdist = next(pathlib.Path("bindings/python/dist").glob("isitai-*.tar.gz"))
          rows.append(("sdist", kb(sdist), int(os.environ["SDIST_MAX_KB"])))
          wheel = next(pathlib.Path(os.environ["RUNNER_TEMP"], "dist").glob("isitai-*.whl"))
          rows.append(("wheel", kb(wheel), int(os.environ["WHEEL_MAX_KB"])))

          lines = ["| paquet | mesuré | budget |", "|---|---|---|"]
          for name, size, budget in rows:
              mark = "⚠️" if size > budget else "✅"
              lines.append(f"| {name} {mark} | {size} Ko | {budget} Ko |")
              if size > budget:
                  over.append(f"{name} : {size} Ko > {budget} Ko")
          summary = "\n".join(lines)
          print(summary)
          pathlib.Path(os.environ.get("GITHUB_STEP_SUMMARY", "/dev/null")).write_text(summary + "\n")
          if over:
              sys.exit("budget de taille dépassé —\n  " + "\n  ".join(over))
          PY

  bindings-node-versions:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - working-directory: bindings/node
        run: |
          npm ci --ignore-scripts
          npm run build
          npm test

  bindings-python-versions:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - working-directory: bindings/python
        run: |
          python -m pip install --quiet maturin==1.16.0
          maturin build --release --out dist
          python -m pip install --quiet --pre --no-index --find-links dist isitai
          python -m unittest discover -s tests -v
